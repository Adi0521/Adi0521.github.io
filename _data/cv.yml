    Projects:
      - name: ProPredict – Agentic Protein Structure Refinement Service
        summary: Python, FastAPI, Celery, Redis, Docker, Modal, Postgres
        highlights:
          - Raised mean pLDDT from 68.9 to 88.2 across the benchmark set through iterative agent-driven refinement; benchmarked on 88 CASP15 targets at TM-score 0.503 without MSA and 0.871 with MSA
